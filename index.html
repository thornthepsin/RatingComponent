<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <script src="https://kit.fontawesome.com/YOUR_KIT_CODE.js" crossorigin="anonymous"></script>
    <title>Rating Component</title>
  </head>
  <body>
    <div class="container">
      <div class="card bg-light rounded-4 border-0 mt-5 shadow-lg">
        <div class="card-body">
          <div class="row">
            <!--Rating Summary-->
            <div class="col-7">
              <h2>What others think about the product</h2>
            </div>
            <div class="col-5">
              <div class="card">
                <div class="card-body text-center">
                  <h3 class="display-5"><i class="fa-solid fa-star fw-semibold text-warning"></i>4.8</h3>
                  <p>Average Rating</p>
                </div>
              </div>
            </div>
          </div>
            <!--Search Review-->
            <div class="row">
              <div class="col-12">
                <div class="input-group-lg">
                  <span class="input-group-text form-control rounded-start-5 rounded-end-5"><i class="fa-solid fa-magnifying-glass"></i>Search Reviews</span>
                    <textarea class="form-control" aria-label="With textarea"></textarea>
                </div>
              </div>
            </div>
        </div>
      </div>
    </div>

    <script src="js/bootstrap.bundle.min.js"></script>
  </body>
</html>
